<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별따기 셈놀이</title>
<meta name="description" content="더하기, 빼기, 곱하기, 나누기 문제 10개를 풀고 별을 모으는 사칙연산 퀴즈">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #E6F1FF;
    --bg-dot: #CFE2FB;
    --card: #FFFFFF;
    --ink: #2B2560;
    --muted: #5B5790;
    --line: #C8D7F2;
    --key-edge: #B7C8EA;
    --plus: #FF7A3D;   --plus-tint: #FFE6DA;   --plus-on: #2B2560;
    --minus: #13A9BF;  --minus-tint: #D6F3F7;  --minus-on: #2B2560;
    --times: #7C4DEB;  --times-tint: #ECE4FF;  --times-on: #FFFFFF;
    --divide: #2FAE5F; --divide-tint: #DDF5E5; --divide-on: #2B2560;
    --star: #FFC21A;
    --star-edge: #E59A00;
    --bonus: #FF5FA2;
    --bonus-edge: #D93A7E;
    --empty-star: #D5DDEE;
    --good: #2FAE5F;
    --bad: #E5484D;
    --op: var(--plus);
    --op-tint: var(--plus-tint);
    --op-on: var(--plus-on);
    --display: "Jua", "Gowun Dodum", system-ui, sans-serif;
    --body: "Gowun Dodum", system-ui, sans-serif;
  }
  body[data-op="sub"] { --op: var(--minus); --op-tint: var(--minus-tint); --op-on: var(--minus-on); }
  body[data-op="mul"] { --op: var(--times); --op-tint: var(--times-tint); --op-on: var(--times-on); }
  body[data-op="div"] { --op: var(--divide); --op-tint: var(--divide-tint); --op-on: var(--divide-on); }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 2px, transparent 2px);
    background-size: 24px 24px;
    color: var(--ink);
    font-family: var(--body);
    font-size: 1.0625rem;
    line-height: 1.5;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  [hidden] { display: none !important; }

  .screen {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
  }
  h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; }
  [tabindex="-1"]:focus { outline: none; }

  /* ---------- Home ---------- */
  .brand { text-align: center; padding: 18px 0 8px; }
  .brand h1 { font-size: clamp(2.4rem, 11vw, 3.25rem); line-height: 1.1; letter-spacing: -0.01em; }
  .brand-mark { display: inline-flex; gap: 6px; margin-bottom: 10px; }
  .brand-mark span {
    width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
    font-family: var(--display); font-size: 1.6rem; line-height: 1;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.18);
  }
  .brand-mark span:nth-child(1) { background: var(--plus); color: var(--plus-on); transform: rotate(-6deg); }
  .brand-mark span:nth-child(2) { background: var(--minus); color: var(--minus-on); transform: rotate(4deg); }
  .brand-mark span:nth-child(3) { background: var(--times); color: var(--times-on); transform: rotate(-3deg); }
  .brand-mark span:nth-child(4) { background: var(--divide); color: var(--divide-on); transform: rotate(7deg); }
  .brand p { margin: 8px 0 0; color: var(--muted); }

  .step { margin-top: 26px; }
  .step h2 { font-size: 1.45rem; margin-bottom: 12px; }

  .ops { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .op-btn {
    --c: var(--plus); --t: var(--plus-tint);
    display: flex; align-items: center; gap: 12px;
    padding: 14px; min-height: 84px;
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 20px;
    box-shadow: 0 5px 0 var(--line);
    text-align: left;
    transition: transform .08s, box-shadow .08s;
  }
  .op-btn[data-op="sub"] { --c: var(--minus); --t: var(--minus-tint); }
  .op-btn[data-op="mul"] { --c: var(--times); --t: var(--times-tint); }
  .op-btn[data-op="div"] { --c: var(--divide); --t: var(--divide-tint); }
  .op-sym {
    flex: none; width: 52px; height: 52px; border-radius: 16px;
    display: grid; place-items: center;
    background: var(--t); color: var(--c);
    font-family: var(--display); font-size: 2.3rem; line-height: 1;
  }
  .op-name { font-family: var(--display); font-size: 1.35rem; }
  .op-btn[aria-pressed="true"] {
    border-color: var(--c); background: var(--t);
    box-shadow: 0 5px 0 var(--c);
  }
  .op-btn[aria-pressed="true"] .op-sym { background: var(--c); color: var(--card); }
  .op-btn[data-op="add"][aria-pressed="true"] .op-sym,
  .op-btn[data-op="sub"][aria-pressed="true"] .op-sym,
  .op-btn[data-op="div"][aria-pressed="true"] .op-sym { color: var(--ink); }
  .op-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .op-btn[aria-pressed="true"]:active { box-shadow: 0 1px 0 var(--c); }

  .levels { display: grid; gap: 10px; }
  .level-btn {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px;
    padding: 12px 16px;
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 5px 0 var(--line);
    text-align: left;
    transition: transform .08s, box-shadow .08s;
  }
  .level-name { font-family: var(--display); font-size: 1.35rem; display: flex; align-items: center; gap: 8px; }
  .level-dots { display: inline-flex; gap: 4px; }
  .level-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--empty-star); }
  .level-dots i.on { background: var(--op); }
  .level-example { font-family: var(--display); font-size: 1.15rem; color: var(--muted); white-space: nowrap; }
  .level-meta { grid-column: 1 / -1; font-size: .95rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .level-best { color: var(--ink); }
  .level-btn[aria-pressed="true"] {
    border-color: var(--op); background: var(--op-tint);
    box-shadow: 0 5px 0 var(--op);
  }
  .level-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .level-btn[aria-pressed="true"]:active { box-shadow: 0 1px 0 var(--op); }

  .start-btn {
    display: block; width: 100%;
    margin-top: 28px; padding: 18px;
    background: var(--op); color: var(--op-on);
    border: 0; border-radius: 22px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.18), 0 6px 0 var(--ink);
    font-family: var(--display); font-size: 1.75rem;
    transition: transform .08s, box-shadow .08s;
  }
  .start-btn:active { transform: translateY(5px); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), 0 1px 0 var(--ink); }
  .rules { margin: 18px 4px 0; color: var(--muted); font-size: .95rem; text-align: center; }

  /* ---------- Quiz ---------- */
  .quiz-top {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  }
  .quit-btn {
    background: var(--card); border: 2px solid var(--line); border-radius: 14px;
    padding: 8px 12px; font-size: .95rem; color: var(--muted);
  }
  .timer { text-align: center; line-height: 1.1; }
  .timer-time {
    font-family: var(--display); font-size: 2.6rem;
    font-variant-numeric: tabular-nums;
  }
  .timer-goal { font-size: .9rem; color: var(--muted); }
  .timer.over .timer-time { color: var(--bad); }
  .timer.over .timer-goal { color: var(--bad); }
  .counter { font-family: var(--display); font-size: 1.2rem; min-width: 64px; text-align: right; }

  .progress { display: flex; gap: 6px; margin: 14px 0 0; padding: 0; list-style: none; }
  .progress li { flex: 1; height: 10px; border-radius: 6px; background: var(--card); border: 2px solid var(--line); }
  .progress li.done { background: var(--op); border-color: var(--op); }
  .progress li.now { border-color: var(--op); }

  .problem {
    margin-top: 18px;
    background: var(--card);
    border: 3px solid var(--op);
    border-radius: 28px;
    box-shadow: 0 7px 0 var(--op);
    padding: 22px 14px 18px;
    text-align: center;
  }
  .equation {
    font-family: var(--display);
    font-size: clamp(2.6rem, 13vw, 4rem);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .equation .sym { color: var(--op); padding: 0 .12em; }
  body[data-op="add"] .equation .sym { color: #E35A1B; }
  body[data-op="sub"] .equation .sym { color: #0B8597; }
  body[data-op="div"] .equation .sym { color: #1E8A47; }
  .answer {
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: 12px; min-width: 60%; min-height: 76px; padding: 0 18px;
    border-radius: 18px;
    background: var(--op-tint);
    border: 3px dashed var(--op);
    font-family: var(--display); font-size: clamp(2.4rem, 12vw, 3.4rem);
    font-variant-numeric: tabular-nums;
  }
  .answer.empty { color: var(--muted); font-size: 1.3rem; }
  .problem.pop { animation: pop .22s ease-out; }
  @keyframes pop { 0% { transform: scale(.94); } 70% { transform: scale(1.02); } 100% { transform: scale(1); } }

  .keypad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-top: 22px;
  }
  .key {
    min-height: 66px;
    background: var(--card);
    border: 3px solid var(--key-edge);
    border-radius: 18px;
    box-shadow: 0 6px 0 var(--key-edge);
    font-family: var(--display); font-size: 2rem; line-height: 1;
    touch-action: manipulation;
    transition: transform .06s, box-shadow .06s;
  }
  .key:active, .key.pressed { transform: translateY(5px); box-shadow: 0 1px 0 var(--key-edge); }
  .key-erase { font-size: 1.25rem; color: var(--muted); }
  .key-ok {
    background: var(--op); color: var(--op-on); border-color: var(--op);
    box-shadow: 0 6px 0 var(--ink);
    font-size: 1.4rem;
  }
  .key-ok:active, .key-ok.pressed { box-shadow: 0 1px 0 var(--ink); }
  .key-ok:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 0 6px 0 var(--ink); }
  .kbd-hint { text-align: center; color: var(--muted); font-size: .9rem; margin: 14px 0 0; }

  /* ---------- Result ---------- */
  .result-head { text-align: center; padding-top: 10px; }
  .stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 6px; }
  .star { width: 64px; height: 64px; }
  .star path { fill: var(--empty-star); stroke: #BAC6DE; stroke-width: 3; stroke-linejoin: round; }
  .star.on path { fill: var(--star); stroke: var(--star-edge); }
  .star.bonus path { fill: var(--bonus); stroke: var(--bonus-edge); }
  .star.lit { animation: star-in .45s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes star-in { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
  .result-head h2 { font-size: clamp(1.9rem, 8vw, 2.4rem); line-height: 1.2; }
  .result-head p { margin: 6px 0 0; color: var(--muted); }

  .scorecard {
    margin-top: 20px;
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 24px;
    padding: 6px 18px;
  }
  .scorecard dl { margin: 0; }
  .scorecard .row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 10px 0;
    border-bottom: 2px dashed var(--line);
  }
  .scorecard .row:last-child { border-bottom: 0; }
  .scorecard dt { color: var(--muted); }
  .scorecard dd { margin: 0; font-family: var(--display); font-size: 1.35rem; font-variant-numeric: tabular-nums; text-align: right; }
  .scorecard .total dt { color: var(--ink); font-family: var(--display); font-size: 1.35rem; }
  .scorecard .total dd { font-size: 2.2rem; color: var(--ink); }
  .bonus-note { display: block; font-family: var(--body); font-size: .85rem; color: var(--muted); }

  .review { margin-top: 24px; }
  .review h3 { font-family: var(--display); font-weight: 400; font-size: 1.45rem; margin: 0 0 10px; }
  .review ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .review li {
    display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px;
    background: var(--card);
    border: 2px solid var(--line);
    border-left-width: 8px;
    border-radius: 14px;
    padding: 10px 12px;
  }
  .review li.right { border-left-color: var(--good); }
  .review li.wrong { border-left-color: var(--bad); }
  .review .num { font-family: var(--display); color: var(--muted); font-size: 1.05rem; }
  .review .eq { font-family: var(--display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
  .review .mine { font-size: .95rem; text-align: right; }
  .review .wrong .mine { color: var(--bad); }
  .review .right .mine { color: #1E7A41; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 26px; }
  .actions .start-btn { margin: 0; font-size: 1.4rem; padding: 16px 10px; }
  .ghost-btn {
    background: var(--card); color: var(--ink);
    border: 3px solid var(--line); border-radius: 22px;
    box-shadow: 0 6px 0 var(--line);
    font-family: var(--display); font-size: 1.4rem; padding: 16px 10px;
    transition: transform .08s, box-shadow .08s;
  }
  .ghost-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--line); }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  @media (max-width: 360px) {
    .op-btn { gap: 8px; padding: 10px; }
    .op-sym { width: 44px; height: 44px; font-size: 2rem; }
    .op-name { font-size: 1.2rem; }
    .star { width: 54px; height: 54px; }
  }
  @media (min-height: 760px) {
    .key { min-height: 74px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-op="add">

<!-- 처음 화면 -->
<main id="home" class="screen">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><span>+</span><span>−</span><span>×</span><span>÷</span></div>
    <h1 id="home-title" tabindex="-1">별따기 셈놀이</h1>
    <p>문제 10개를 풀고 별을 모아요</p>
  </div>

  <section class="step" aria-labelledby="pick-op">
    <h2 id="pick-op">어떤 계산을 할까요?</h2>
    <div class="ops" id="ops">
      <button type="button" class="op-btn" data-op="add" aria-pressed="true"><span class="op-sym" aria-hidden="true">+</span><span class="op-name">더하기</span></button>
      <button type="button" class="op-btn" data-op="sub" aria-pressed="false"><span class="op-sym" aria-hidden="true">−</span><span class="op-name">빼기</span></button>
      <button type="button" class="op-btn" data-op="mul" aria-pressed="false"><span class="op-sym" aria-hidden="true">×</span><span class="op-name">곱하기</span></button>
      <button type="button" class="op-btn" data-op="div" aria-pressed="false"><span class="op-sym" aria-hidden="true">÷</span><span class="op-name">나누기</span></button>
    </div>
  </section>

  <section class="step" aria-labelledby="pick-level">
    <h2 id="pick-level">얼마나 어렵게 할까요?</h2>
    <div class="levels" id="levels"></div>
  </section>

  <button type="button" class="start-btn" id="start">시작하기</button>
  <p class="rules">다 맞히면 별 3개! 7개 이상 맞히고 목표 시간 안에 끝내면 분홍 보너스 별과 시간 보너스 점수를 받아요.</p>
</main>

<!-- 문제 화면 -->
<main id="quiz" class="screen" hidden>
  <div class="quiz-top">
    <button type="button" class="quit-btn" id="quit">그만하기</button>
    <div class="timer" id="timer" role="timer" aria-label="걸린 시간">
      <div class="timer-time" id="timer-time">0:00</div>
      <div class="timer-goal" id="timer-goal">목표 1:00</div>
    </div>
    <div class="counter" id="counter" aria-hidden="true">1 / 10</div>
  </div>
  <ol class="progress" id="progress" aria-hidden="true"></ol>

  <div class="problem" id="problem">
    <h2 class="sr-only" id="quiz-title" tabindex="-1">문제</h2>
    <div class="equation" id="equation" aria-live="polite"></div>
    <div class="answer empty" id="answer" aria-live="polite">답을 눌러요</div>
  </div>

  <div class="keypad" id="keypad">
    <button type="button" class="key" data-key="1">1</button>
    <button type="button" class="key" data-key="2">2</button>
    <button type="button" class="key" data-key="3">3</button>
    <button type="button" class="key" data-key="4">4</button>
    <button type="button" class="key" data-key="5">5</button>
    <button type="button" class="key" data-key="6">6</button>
    <button type="button" class="key" data-key="7">7</button>
    <button type="button" class="key" data-key="8">8</button>
    <button type="button" class="key" data-key="9">9</button>
    <button type="button" class="key key-erase" data-key="erase" aria-label="한 글자 지우기">지우기</button>
    <button type="button" class="key" data-key="0">0</button>
    <button type="button" class="key key-ok" data-key="ok" id="ok" disabled>확인</button>
  </div>
  <p class="kbd-hint">키보드 숫자와 Enter 키로도 풀 수 있어요</p>
</main>

<!-- 결과 화면 -->
<main id="result" class="screen" hidden>
  <div class="result-head">
    <div class="stars" id="stars"></div>
    <h2 id="result-title" tabindex="-1"></h2>
    <p id="result-sub"></p>
  </div>

  <div class="scorecard">
    <dl>
      <div class="row"><dt>맞은 문제</dt><dd id="r-correct"></dd></div>
      <div class="row"><dt>점수</dt><dd id="r-score"></dd></div>
      <div class="row"><dt>걸린 시간</dt><dd id="r-time"></dd></div>
      <div class="row"><dt>시간 보너스</dt><dd id="r-bonus"></dd></div>
      <div class="row total"><dt>합계</dt><dd id="r-total"></dd></div>
    </dl>
  </div>

  <section class="review" aria-labelledby="review-title">
    <h3 id="review-title">정답 확인</h3>
    <ol id="review"></ol>
  </section>

  <div class="actions">
    <button type="button" class="ghost-btn" id="home-btn">처음으로</button>
    <button type="button" class="start-btn" id="again">한 번 더</button>
  </div>
</main>

<script>
(() => {
  'use strict';

  const OPS = {
    add: { sym: '+', name: '더하기' },
    sub: { sym: '−', name: '빼기' },
    mul: { sym: '×', name: '곱하기' },
    div: { sym: '÷', name: '나누기' },
  };

  // 목표 시간(초): 이 안에 끝내고 7문제 이상 맞히면 보너스 별과 시간 보너스 점수(최대 50점)를 줘요
  const LEVELS = {
    easy:   { name: '쉬움',   dots: 1, target: 60 },
    normal: { name: '보통',   dots: 2, target: 90 },
    hard:   { name: '어려움', dots: 3, target: 150 },
  };

  const EXAMPLES = {
    add: { easy: '7 + 5',  normal: '48 + 36', hard: '365 + 478' },
    sub: { easy: '14 − 6', normal: '72 − 35', hard: '804 − 267' },
    mul: { easy: '4 × 6',  normal: '7 × 8',   hard: '36 × 7' },
    div: { easy: '15 ÷ 3', normal: '56 ÷ 8',  hard: '378 ÷ 6' },
  };

  const QUESTION_COUNT = 10;
  const BONUS_MIN_CORRECT = 7;
  const MAX_DIGITS = 4;
  const MAX_TIME_BONUS = 50;

  const rand = (min, max) => min + Math.floor(Math.random() * (max - min + 1));

  // 문제 하나 만들기: { a, b, answer }
  function makeProblem(op, level) {
    let a, b;
    switch (op) {
      case 'add':
        if (level === 'easy')        { a = rand(1, 9);     b = rand(1, 9); }
        else if (level === 'normal') { a = rand(11, 99);   b = rand(11, 99); }
        else                         { a = rand(100, 999); b = rand(100, 999); }
        return { a, b, answer: a + b };
      case 'sub':
        if (level === 'easy')        { a = rand(2, 18);    b = rand(1, Math.min(9, a - 1)); }
        else if (level === 'normal') { a = rand(20, 99);   b = rand(11, a - 1); }
        else                         { a = rand(200, 999); b = rand(100, a - 1); }
        return { a, b, answer: a - b };
      case 'mul':
        if (level === 'easy')        { a = rand(2, 5);   b = rand(1, 9); }
        else if (level === 'normal') { a = rand(2, 9);   b = rand(2, 9); }
        else                         { a = rand(12, 99); b = rand(3, 9); }
        return { a, b, answer: a * b };
      case 'div': {
        // 나머지가 없는 나눗셈만 냅니다
        let d, q;
        if (level === 'easy')        { d = rand(2, 5); q = rand(1, 9); }
        else if (level === 'normal') { d = rand(2, 9); q = rand(2, 9); }
        else                         { d = rand(3, 9); q = rand(12, 99); }
        return { a: d * q, b: d, answer: q };
      }
    }
    throw new Error('unknown op ' + op);
  }

  function makeSet(op, level) {
    const seen = new Set();
    const list = [];
    let guard = 0;
    while (list.length < QUESTION_COUNT) {
      const p = makeProblem(op, level);
      const key = p.a + '|' + p.b;
      if (seen.has(key) && guard++ < 200) continue;
      seen.add(key);
      list.push(p);
    }
    return list;
  }

  function baseStars(correct) {
    if (correct === QUESTION_COUNT) return 3;
    if (correct >= 8) return 2;
    if (correct >= 5) return 1;
    return 0;
  }

  function fmtTime(sec) {
    const s = Math.max(0, Math.floor(sec));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function fmtTimeWords(sec) {
    const s = Math.floor(sec);
    const m = Math.floor(s / 60), r = s % 60;
    if (m === 0) return r + '초';
    return r === 0 ? m + '분' : m + '분 ' + r + '초';
  }

  // 최고 기록(이 기기에만 저장)
  const BEST_KEY = 'byeolttagi-best-v1';
  function loadBest() {
    try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveBest(op, level, rec) {
    try {
      const all = loadBest();
      const k = op + '_' + level;
      const prev = all[k];
      if (!prev || rec.total > prev.total) {
        all[k] = rec;
        localStorage.setItem(BEST_KEY, JSON.stringify(all));
      }
    } catch (e) { /* 저장을 못 해도 게임은 계속돼요 */ }
  }

  // ---------- 상태 ----------
  const state = {
    op: 'add',
    level: 'easy',
    problems: [],
    answers: [],
    index: 0,
    input: '',
    startedAt: 0,
    elapsed: 0,
    timerId: 0,
  };

  const $ = (id) => document.getElementById(id);
  const screens = { home: $('home'), quiz: $('quiz'), result: $('result') };

  function show(name, focusId) {
    for (const k in screens) screens[k].hidden = k !== name;
    window.scrollTo(0, 0);
    if (focusId) $(focusId).focus({ preventScroll: true });
  }

  // ---------- 처음 화면 ----------
  function renderLevels() {
    const best = loadBest();
    const box = $('levels');
    box.innerHTML = '';
    for (const key of Object.keys(LEVELS)) {
      const lv = LEVELS[key];
      const rec = best[state.op + '_' + key];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'level-btn';
      btn.dataset.level = key;
      btn.setAttribute('aria-pressed', String(key === state.level));
      const dots = Array.from({ length: 3 }, (_, i) => '<i class="' + (i < lv.dots ? 'on' : '') + '"></i>').join('');
      let bestText = '아직 기록 없음';
      if (rec) {
        bestText = '최고 ' + '★'.repeat(rec.stars) + '☆'.repeat(4 - rec.stars) + ' ' + rec.total + '점';
      }
      btn.innerHTML =
        '<span class="level-name">' + lv.name + '<span class="level-dots" aria-hidden="true">' + dots + '</span></span>' +
        '<span class="level-example" aria-label="예시 문제 ' + EXAMPLES[state.op][key] + '">' + EXAMPLES[state.op][key] + '</span>' +
        '<span class="level-meta"><span>목표 시간 ' + fmtTimeWords(lv.target) + '</span><span class="level-best">' + bestText + '</span></span>';
      box.appendChild(btn);
    }
  }

  function setOp(op) {
    state.op = op;
    document.body.dataset.op = op;
    for (const b of document.querySelectorAll('.op-btn')) b.setAttribute('aria-pressed', String(b.dataset.op === op));
    renderLevels();
  }

  $('ops').addEventListener('click', (e) => {
    const b = e.target.closest('.op-btn');
    if (b) setOp(b.dataset.op);
  });
  $('levels').addEventListener('click', (e) => {
    const b = e.target.closest('.level-btn');
    if (!b) return;
    state.level = b.dataset.level;
    for (const x of document.querySelectorAll('.level-btn')) x.setAttribute('aria-pressed', String(x === b));
  });
  $('start').addEventListener('click', startQuiz);

  // ---------- 문제 화면 ----------
  function startQuiz() {
    state.problems = makeSet(state.op, state.level);
    state.answers = [];
    state.index = 0;
    state.input = '';
    state.elapsed = 0;
    const target = LEVELS[state.level].target;
    $('timer-goal').textContent = '목표 ' + fmtTime(target);
    $('timer').classList.remove('over');
    $('progress').innerHTML = Array.from({ length: QUESTION_COUNT }, () => '<li></li>').join('');
    renderProblem();
    show('quiz', 'quiz-title');
    state.startedAt = performance.now();
    tick();
    clearInterval(state.timerId);
    state.timerId = setInterval(tick, 250);
  }

  function tick() {
    state.elapsed = (performance.now() - state.startedAt) / 1000;
    $('timer-time').textContent = fmtTime(state.elapsed);
    $('timer').classList.toggle('over', state.elapsed > LEVELS[state.level].target);
  }

  function renderProblem() {
    const p = state.problems[state.index];
    const sym = OPS[state.op].sym;
    $('equation').innerHTML = p.a + '<span class="sym">' + sym + '</span>' + p.b + ' <span class="sym">=</span> ?';
    $('equation').setAttribute('aria-label', (state.index + 1) + '번 문제. ' + p.a + ' ' + OPS[state.op].name + ' ' + p.b);
    $('counter').textContent = (state.index + 1) + ' / ' + QUESTION_COUNT;
    const dots = $('progress').children;
    for (let i = 0; i < dots.length; i++) {
      dots[i].className = i < state.index ? 'done' : i === state.index ? 'now' : '';
    }
    renderInput();
    const card = $('problem');
    card.classList.remove('pop');
    void card.offsetWidth;
    card.classList.add('pop');
  }

  function renderInput() {
    const el = $('answer');
    if (state.input === '') {
      el.textContent = '답을 눌러요';
      el.classList.add('empty');
    } else {
      el.textContent = state.input;
      el.classList.remove('empty');
    }
    $('ok').disabled = state.input === '';
  }

  function press(key) {
    if (screens.quiz.hidden) return;
    if (key === 'erase') {
      state.input = state.input.slice(0, -1);
    } else if (key === 'ok') {
      submit();
      return;
    } else if (/^\d$/.test(key)) {
      if (state.input.length >= MAX_DIGITS) return;
      state.input = state.input === '0' ? key : state.input + key;
    }
    renderInput();
  }

  function submit() {
    if (state.input === '') return;
    state.answers.push(Number(state.input));
    state.input = '';
    state.index++;
    if (state.index >= QUESTION_COUNT) finish();
    else renderProblem();
  }

  $('keypad').addEventListener('click', (e) => {
    const b = e.target.closest('.key');
    if (b && !b.disabled) press(b.dataset.key);
  });

  function flashKey(key) {
    const b = document.querySelector('.key[data-key="' + key + '"]');
    if (!b) return;
    b.classList.add('pressed');
    setTimeout(() => b.classList.remove('pressed'), 90);
  }

  document.addEventListener('keydown', (e) => {
    if (screens.quiz.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    let key = null;
    if (/^\d$/.test(e.key)) key = e.key;
    else if (e.key === 'Backspace' || e.key === 'Delete') key = 'erase';
    else if (e.key === 'Enter') {
      // 버튼에 포커스가 있을 때 Enter는 그 버튼을 누르는 동작이므로 겹치지 않게 막아요
      if (document.activeElement && document.activeElement.closest('.keypad, .quit-btn')) return;
      key = 'ok';
    }
    if (key === null) return;
    e.preventDefault();
    flashKey(key);
    press(key);
  });

  $('quit').addEventListener('click', () => {
    if (!confirm('그만하면 지금까지 푼 문제는 저장되지 않아요. 그만할까요?')) return;
    clearInterval(state.timerId);
    renderLevels();
    show('home', 'home-title');
  });

  // ---------- 결과 화면 ----------
  const STAR_SVG = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5 L39.6 22.6 L58.6 24.3 L44.2 36.9 L48.5 55.6 L32 45.8 L15.5 55.6 L19.8 36.9 L5.4 24.3 L24.4 22.6 Z"/></svg>';

  function finish() {
    clearInterval(state.timerId);
    tick();
    const elapsed = state.elapsed;
    const target = LEVELS[state.level].target;
    const correct = state.problems.reduce((n, p, i) => n + (p.answer === state.answers[i] ? 1 : 0), 0);
    const score = correct * 10;
    const fast = elapsed <= target;
    const bonusEarned = fast && correct >= BONUS_MIN_CORRECT;
    // 남은 시간 비율만큼, 최대 50점
    const timeBonus = bonusEarned ? Math.round((target - elapsed) / target * MAX_TIME_BONUS) : 0;
    const stars = baseStars(correct);
    const total = score + timeBonus;
    const totalStars = stars + (bonusEarned ? 1 : 0);

    saveBest(state.op, state.level, { stars: totalStars, total });

    // 별: 기본 3칸 + 보너스 별
    const starBox = $('stars');
    starBox.innerHTML = '';
    starBox.setAttribute('role', 'img');
    starBox.setAttribute('aria-label', '별 ' + totalStars + '개' + (bonusEarned ? ', 보너스 별 포함' : ''));
    let delay = 0;
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 'star' + (i < stars ? ' on lit' : '');
      if (i < stars) { s.style.animationDelay = delay + 'ms'; delay += 180; }
      s.innerHTML = STAR_SVG;
      starBox.appendChild(s);
    }
    if (bonusEarned) {
      const s = document.createElement('span');
      s.className = 'star bonus lit';
      s.style.animationDelay = delay + 'ms';
      s.innerHTML = STAR_SVG;
      starBox.appendChild(s);
    }

    let title;
    if (correct === QUESTION_COUNT) title = bonusEarned ? '완벽해요! 번개처럼 빨랐어요' : '완벽해요! 다 맞혔어요';
    else if (correct >= 8) title = '아주 잘했어요!';
    else if (correct >= 5) title = '좋아요, 조금만 더!';
    else title = '천천히 다시 해 봐요';
    $('result-title').textContent = title;
    $('result-sub').textContent = OPS[state.op].name + ' ' + LEVELS[state.level].name + ' 단계';

    $('r-correct').textContent = correct + ' / ' + QUESTION_COUNT;
    $('r-score').textContent = score + '점';
    $('r-time').textContent = fmtTimeWords(elapsed);
    const bonusEl = $('r-bonus');
    if (bonusEarned) {
      bonusEl.innerHTML = '+' + timeBonus + '점<span class="bonus-note">목표 ' + fmtTimeWords(target) + '보다 ' + fmtTimeWords(target - elapsed) + ' 빨랐어요</span>';
    } else if (fast) {
      bonusEl.innerHTML = '0점<span class="bonus-note">' + BONUS_MIN_CORRECT + '문제 이상 맞히면 받아요</span>';
    } else {
      bonusEl.innerHTML = '0점<span class="bonus-note">목표 시간 ' + fmtTimeWords(target) + ' 안에 끝내면 받아요</span>';
    }
    $('r-total').textContent = total + '점';

    const sym = OPS[state.op].sym;
    $('review').innerHTML = state.problems.map((p, i) => {
      const mine = state.answers[i];
      const ok = mine === p.answer;
      return '<li class="' + (ok ? 'right' : 'wrong') + '">' +
        '<span class="num">' + (i + 1) + '</span>' +
        '<span class="eq">' + p.a + ' ' + sym + ' ' + p.b + ' = ' + p.answer + '</span>' +
        '<span class="mine">' + (ok ? '맞았어요 ✓' : '내 답 ' + mine + ' ✗') + '</span>' +
        '</li>';
    }).join('');

    show('result', 'result-title');
  }

  $('again').addEventListener('click', startQuiz);
  $('home-btn').addEventListener('click', () => { renderLevels(); show('home', 'home-title'); });

  // 테스트용으로 문제 생성기를 노출해요
  window.__quiz = { makeProblem, makeSet, baseStars };

  setOp('add');
})();
</script>
</body>
</html>
